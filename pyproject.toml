[project]
name = "agentsmd-lint"
version = "0.1.0"
description = "Lint an AGENTS.md or CLAUDE.md against the repository it describes: dead paths, unknown scripts, overviews and unverifiable instructions. Stdlib only."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "Ajin Baby" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.urls]
Homepage = "https://cloudandsre.com"
Repository = "https://github.com/ajinb/agentsmd-lint"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
